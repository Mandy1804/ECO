# ----------------------------------------------------
# Configuração do Servidor
# ----------------------------------------------------
server.port=8080

# ----------------------------------------------------
# Configuração do Banco de Dados MySQL (Docker Otimizado)
# ----------------------------------------------------
# Host e Porta: Mantemos 3306 se o Docker estiver configurado para esta porta.
# Parâmetros: Adicionamos allowPublicKeyRetrieval para resolver erros de segurança do MySQL 8+.
spring.datasource.url=jdbc:mysql://localhost:3308/ecodescarte_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Credenciais do Docker (ecouser/ecopass) - mais seguras que root.
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------
# Configuração do Spring Data JPA / Hibernate
# ----------------------------------------------------

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect